<style>
#papaipak-article-secondary-interaction-r3{--pp-navy:#072D59;--pp-pink:#FD6E88;--pp-page:#FFFFFF;--pp-copy:#53657C;--pp-ease:cubic-bezier(.2,.8,.2,1);width:100%;background:transparent}

#papaipak-article-secondary-interaction-r3 .pp-product *{box-sizing:border-box}
#papaipak-article-secondary-interaction-r3 .pp-story{display:flex;align-items:center;gap:24px;min-height:165px;color:var(--pp-navy);text-decoration:none;border-radius:18px}
#papaipak-article-secondary-interaction-r3 .pp-photo{flex:0 0 208px;width:208px;aspect-ratio:16/9;overflow:clip;border-radius:16px;background:var(--pp-page)}
#papaipak-article-secondary-interaction-r3 .pp-photo img{display:block;width:100%;height:100%;object-fit:contain;transform:none}
#papaipak-article-secondary-interaction-r3 .pp-copy{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px;transform:translateX(0);transition:transform 336ms var(--pp-ease)}
#papaipak-article-secondary-interaction-r3 .pp-topic{font-size:14px;font-weight:400;line-height:1.5}
#papaipak-article-secondary-interaction-r3 h3{margin:0;font-family:'Mitr',sans-serif;font-size:22px;font-weight:400;line-height:1.45;min-width:0}
#papaipak-article-secondary-interaction-r3 .pp-title{position:relative;display:inline-block;max-width:100%;vertical-align:top;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#papaipak-article-secondary-interaction-r3 .pp-title::after{content:'';position:absolute;left:0;right:0;bottom:1px;height:2px;background:var(--pp-pink);transform:scaleX(0);transform-origin:left;transition:transform 336ms var(--pp-ease)}
#papaipak-article-secondary-interaction-r3 p{margin:0;font-size:14px;font-weight:400;line-height:1.6;color:var(--pp-copy);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
#papaipak-article-secondary-interaction-r3 .pp-read{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;line-height:1.5}
#papaipak-article-secondary-interaction-r3 .pp-read-icon{display:inline-flex;transform:translate(0,0);transition:transform 336ms var(--pp-ease)}
#papaipak-article-secondary-interaction-r3 .pp-read-icon svg{width:16px;height:16px}
#papaipak-article-secondary-interaction-r3 .pp-index-row{display:flex;justify-content:flex-end;margin-bottom:36px}
#papaipak-article-secondary-interaction-r3 .pp-index{position:relative;display:inline-flex;height:44px;align-items:center;gap:8px;color:var(--pp-navy);font-size:14px;line-height:1.5;text-decoration:none;border-radius:12px;isolation:isolate}
#papaipak-article-secondary-interaction-r3 .pp-index svg{width:16px;height:16px}
#papaipak-article-secondary-interaction-r3 .pp-story{transform:translateY(0);transition:transform 140ms ease-out}

#papaipak-article-secondary-interaction-r3 .pp-copy{position:relative;isolation:isolate}
#papaipak-article-secondary-interaction-r3 h3{color:inherit}
#papaipak-article-secondary-interaction-r3.pp-hover .pp-copy{transform:translateX(3px)}
#papaipak-article-secondary-interaction-r3.pp-hover .pp-title::after,#papaipak-article-secondary-interaction-r3 .pp-story:focus-visible .pp-title::after{transform:scaleX(1)}
#papaipak-article-secondary-interaction-r3.pp-hover .pp-read-icon{transform:translate(2px,-2px)}
@media(hover:hover) and (pointer:fine){
  #papaipak-article-secondary-interaction-r3 .pp-story:hover .pp-copy{transform:translateX(3px)}
  #papaipak-article-secondary-interaction-r3 .pp-story:hover .pp-title::after{transform:scaleX(1)}
  #papaipak-article-secondary-interaction-r3 .pp-story:hover .pp-read-icon{transform:translate(2px,-2px)}
}
#papaipak-article-secondary-interaction-r3.pp-reduced .pp-story .pp-copy,#papaipak-article-secondary-interaction-r3.pp-reduced .pp-story .pp-read-icon{transition:none;transform:none}
#papaipak-article-secondary-interaction-r3.pp-reduced .pp-story .pp-title::after{transition:none}
#papaipak-article-secondary-interaction-r3 .pp-status{margin-top:12px}
@media(prefers-reduced-motion:reduce){
  #papaipak-article-secondary-interaction-r3 .pp-copy,#papaipak-article-secondary-interaction-r3 .pp-read-icon{transition:none!important;transform:none!important}
  #papaipak-article-secondary-interaction-r3 .pp-title::after{transition:none!important}
}
@media(max-width:480px){
  #papaipak-article-secondary-interaction-r3 .pp-stage{padding:20px 14px}
  #papaipak-article-secondary-interaction-r3 .pp-story{flex-direction:column;align-items:stretch;gap:16px}
  #papaipak-article-secondary-interaction-r3 .pp-photo{flex-basis:auto;width:100%}
  #papaipak-article-secondary-interaction-r3 .pp-copy{flex-basis:auto}
}
</style>
<script>
(() => {
  const root = document.getElementById('papaipak-article-secondary-interaction-r3');
  if (!root) return;
  const reset = root.querySelector('[data-reset]');
  const reducedInput = root.querySelector('[data-reduced]');
  const story = root.querySelector('.pp-story');
  const index = root.querySelector('.pp-index');
  const status = root.querySelector('[data-status]');
  const copy = root.querySelector('.pp-copy');
  if (!reset || !reducedInput || !story || !index || !copy || !status) return;
  const media = window.matchMedia('(prefers-reduced-motion: reduce)');
  const entries = [{link:story,label:'บทความรอง'}];
  let active = [];
  let run = 0;
  function reduced() { return reducedInput.checked || media.matches; }
  function cancel() {
    run += 1;
    active.forEach(animation => animation.cancel());
    active = [];
    entries.forEach(entry => entry.link.classList.remove('pp-down'));
  }
  entries.forEach(entry => {
    entry.link.addEventListener('pointerdown', event => {
      if (event.button !== 0 || reduced()) return;
      cancel();
      entry.link.classList.add('pp-down');
    });
    entry.link.addEventListener('pointerup', () => entry.link.classList.remove('pp-down'));
    entry.link.addEventListener('pointerleave', () => entry.link.classList.remove('pp-down'));
    entry.link.addEventListener('pointercancel', cancel);
    entry.link.addEventListener('click', event => {
      event.preventDefault();
      cancel();
      const thisRun = run;
      if (reduced() || typeof entry.link.animate !== 'function') {
        status.textContent = entry.label+' · จังหวะเปิดปลายทางทันที · ตัวอย่างคงภาพไว้';
        return;
      }
      const bounce = entry.link.animate([{transform:'translateY(3px)'},{transform:'translateY(-4px)',offset:.45},{transform:'translateY(0)'}],{duration:420,easing:'cubic-bezier(.22,1,.36,1)',iterations:1});
      active = [bounce];
      status.textContent = entry.label+' · เด้งอย่างเดียว 420ms';
      Promise.all(active.map(animation => animation.finished)).then(() => {
        if (thisRun !== run) return;
        active.forEach(animation => animation.cancel());
        active = [];
        status.textContent = entry.label+' · จังหวะเปิดปลายทางเมื่อครบ 420ms · ตัวอย่างคงภาพไว้';
      }).catch(() => {});
    });
    entry.link.addEventListener('auxclick',event => event.preventDefault());
  });
  function render() {
    cancel();
    root.classList.toggle('pp-reduced',reduced());
    status.textContent = 'ลองกดบทความรองหรือลิงก์บทความทั้งหมด · ตัวอย่างยังไม่เปิดปลายทาง';
  }
  index.addEventListener('click', event => {
    event.preventDefault();
    cancel();
    status.textContent = 'บทความทั้งหมด · จังหวะเปิดปลายทางทันที ไม่มีแอนิเมชัน · ตัวอย่างยังไม่เปิดหน้าจริง';
  });
  index.addEventListener('auxclick', event => event.preventDefault());
  reset.addEventListener('click',render);
  reducedInput.addEventListener('change',render);
  media.addEventListener('change',render);
  if (globalThis.lucide) lucide.createIcons({ attrs:{width:16,height:16} });
  render();
})();
</script>
