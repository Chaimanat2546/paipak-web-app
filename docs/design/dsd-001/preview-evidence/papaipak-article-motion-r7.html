<style>
#papaipak-motion-r7{--pp-navy:#072D59;--pp-light:#DBF2FC;--pp-page:#FFFFFF;--pp-copy:#53657C;--pp-ease:cubic-bezier(.2,.8,.2,1);width:100%;background:transparent}
#papaipak-motion-r7 .pp-controls{margin-bottom:16px}
#papaipak-motion-r7 .pp-stage{padding:28px 20px 20px}
#papaipak-motion-r7 .pp-product{max-width:696px;margin:0 auto;background:var(--pp-page);color:var(--pp-navy);font-family:'Mitr',sans-serif}
#papaipak-motion-r7 .pp-product *{box-sizing:border-box}
#papaipak-motion-r7 .pp-story{display:block;position:relative;isolation:isolate;padding-bottom:24px;color:var(--pp-navy);text-decoration:none;border-radius:24px}
#papaipak-motion-r7 .pp-backing{position:absolute;left:0;bottom:0;width:100%;height:55.1%;object-fit:fill;border-radius:0 0 24px 24px;pointer-events:none;z-index:-1}
#papaipak-motion-r7 .pp-photo{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:clip;transform-origin:50% 60%;transform:translateY(0) rotate(0deg) scale(1);transition:transform 336ms var(--pp-ease);background:var(--pp-page)}
#papaipak-motion-r7 .pp-photo img{display:block;width:100%;height:100%;object-fit:contain;transform:none}
#papaipak-motion-r7 .pp-caption{position:relative;z-index:1;margin:-76px 24px 0;padding:24px;border-radius:20px;background:var(--pp-page);box-shadow:0 8px 24px #072D591F;display:flex;flex-direction:column;gap:10px;transform:translateY(0);transition:transform 336ms var(--pp-ease)}
#papaipak-motion-r7 .pp-topic{font-size:14px;font-weight:400;line-height:1.5}
#papaipak-motion-r7 .pp-title-row{display:flex;gap:24px;align-items:center;justify-content:space-between}
#papaipak-motion-r7 h3{font-family:'Mitr',sans-serif;font-weight:400;font-size:26px;line-height:1.4;margin:0}
#papaipak-motion-r7 .pp-arrow{display:flex;flex:0 0 44px;width:44px;height:44px;align-items:center;justify-content:center;border-radius:50%;background:var(--pp-navy);color:var(--pp-page)}
#papaipak-motion-r7 .pp-arrow svg{width:18px;height:18px}
#papaipak-motion-r7 p{font-size:16px;font-weight:400;line-height:1.6;color:var(--pp-copy);margin:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
#papaipak-motion-r7 .pp-story:focus-visible{outline:2px solid var(--pp-navy);outline-offset:6px}
#papaipak-motion-r7.pp-hover .pp-photo{transform:translateY(-6px) rotate(1.5deg) scale(1.035)}
#papaipak-motion-r7.pp-hover .pp-caption{transform:translateY(-6px)}
#papaipak-motion-r7 .pp-status{margin-top:12px}
@media(hover:hover) and (pointer:fine){
  #papaipak-motion-r7 .pp-story:hover .pp-photo{transform:translateY(-6px) rotate(1.5deg) scale(1.035)}
  #papaipak-motion-r7 .pp-story:hover .pp-caption{transform:translateY(-6px)}
}
#papaipak-motion-r7.pp-reduced .pp-story .pp-photo,#papaipak-motion-r7.pp-reduced .pp-story .pp-caption{transition:none;transform:none}
@media(prefers-reduced-motion:reduce){
  #papaipak-motion-r7 .pp-photo,#papaipak-motion-r7 .pp-caption{transition:none!important;transform:none!important}
}
@media(max-width:480px){
  #papaipak-motion-r7 .pp-stage{padding:24px 14px 16px}
  #papaipak-motion-r7 .pp-caption{margin:-32px 12px 0;padding:18px;gap:8px}
  #papaipak-motion-r7 h3{font-size:22px}
  #papaipak-motion-r7 .pp-title-row{gap:12px}
}
</style>
<script>
(() => {
  const root = document.getElementById('papaipak-motion-r7');
  if (!root) return;
  const hoverButton = root.querySelector('[data-hover]');
  const reducedInput = root.querySelector('[data-reduced]');
  const story = root.querySelector('.pp-story');
  const status = root.querySelector('[data-status]');
  if (!hoverButton || !reducedInput || !story || !status) return;
  const media = window.matchMedia('(prefers-reduced-motion: reduce)');
  let forceHover = false;
  function render() {
    const reduced = reducedInput.checked || media.matches;
    root.classList.toggle('pp-hover', forceHover);
    root.classList.toggle('pp-reduced', reduced);
    hoverButton.setAttribute('aria-pressed', String(forceHover));
    hoverButton.textContent = forceHover ? 'คืนภาพปกติ' : 'จำลอง hover';
    status.textContent = reduced ? 'ลดการเคลื่อนไหว · ภาพคงที่ · ลิงก์ยังไม่เชื่อม' : (forceHover ? 'สถานะ hover · ขยายทั้งกรอบรูป · ลิงก์ยังไม่เชื่อม' : 'ภาพปกติ · ข้อมูลจำลอง · ลิงก์ยังไม่เชื่อม');
  }
  hoverButton.addEventListener('click', () => { forceHover = !forceHover; render(); });
  reducedInput.addEventListener('change', render);
  media.addEventListener('change', render);
  story.addEventListener('click', event => { event.preventDefault(); });
  render();
})();
</script>
