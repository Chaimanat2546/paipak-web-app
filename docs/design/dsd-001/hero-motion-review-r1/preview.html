<script>
(() => {
  const root = document.getElementById('papaipak-hero-timing-r1');
  const pictures = [0,1,2].map(i => root.querySelector('[data-art="'+i+'"]').src);
  const overlays = [0,1,2].map(i => root.querySelector('[data-overlay="'+i+'"]').src);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  root.querySelectorAll('[data-duration]').forEach(section => {
    const current = section.querySelector('.pp-current');
    const incoming = section.querySelector('.pp-next');
    const fixed = section.querySelector('.pp-fixed');
    const button = section.querySelector('[data-play]');
    const status = section.querySelector('[data-state]');
    const duration = Number(section.dataset.duration);
    let index = 0;
    let moving = false;
    current.src = pictures[0];
    incoming.src = pictures[1];
    fixed.src = overlays[0];
    button.addEventListener('click', async () => {
      if (moving) return;
      moving = true;
      button.disabled = true;
      const next = (index + 1) % pictures.length;
      incoming.src = pictures[next];
      try {
        await Promise.all([current.decode().catch(() => {}), incoming.decode().catch(() => {})]);
        if (!reduced.matches && typeof current.animate === 'function') {
          const timing = { duration, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' };
          const outgoing = current.animate([{transform:'translateX(0)'},{transform:'translateX(-100%)'}],timing);
          const arriving = incoming.animate([{transform:'translateX(100%)'},{transform:'translateX(0)'}],timing);
          await Promise.all([outgoing.finished,arriving.finished]);
          current.src = pictures[next];
          fixed.src = overlays[next];
          await current.decode().catch(() => {});
          outgoing.cancel();
          arriving.cancel();
        } else {
          current.src = pictures[next];
          fixed.src = overlays[next];
        }
        index = next;
        status.textContent = 'ภาพ '+(index+1)+' / 3'+(reduced.matches?' · ลดการเคลื่อนไหว':'');
      } finally {
        button.disabled = false;
        moving = false;
      }
    });
  });
})();
</script>
