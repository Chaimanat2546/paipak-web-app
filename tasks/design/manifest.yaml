  pencil_task_section: FvFoc
  g4_final_pencil_section: uzxJt
  g4_revision_review_frame_count: 12
  g0_confirmed_decisions:
  - Admins add clips by manually pasting TikTok links, confirmed on 2026-11-12.
  - Show all enabled clips that are ready to display in the saved order. On save, show a dismissible confirmation about potentially slower homepage loading when seven or more clips will be shown.
  - Use only TikTok covers. Keep a clip hidden when its cover fails to load. Admins cannot replace the cover.
  - A clip may optionally link to one property. Admins search by property name or DV code using the category-management pattern.
  - Show a View property button only on linked clips. The button opens that property's detail page directly.
  - Keep the clip visible and hide the View property button when the linked property's detail page cannot be viewed.
  - Use the TikTok title by default and allow admins to edit the website display title. Use source credit when available and link to TikTok when credit cannot be retrieved.
  - Once a TikTok cover becomes available again, the admin must re-enable the clip and save before it returns to the homepage.
  - Notify clip managers through the admin notification bell when a clip is hidden because its cover cannot load or is confirmed unplayable. The notification names the clip and problem and opens the affected clip directly.
  - On the homepage, offer retry for a temporary player load failure, hide confirmed unplayable clips, and hide the TikTok section when no displayable clips remain.
  - Use a single clip manager permission set for managing clips, saving homepage changes, and receiving clip notifications.
  depends_on:
  - UID-001
  - UID-010
  decision_refs:
  - BRAND-001
  - PAGE-001
  scope: Desktop and mobile admin design for manually curating TikTok links, ordering clips, controlling homepage visibility, and notifying admins about clip issues.
  deliverables:
  - desktop_and_mobile_wireframes_and_high_fidelity_screens
  - homepage_display_state_examples
  - interaction_specification_and_g4_review_package
  artifact_links:
  - tasks/design/UID-011.md
  - docs/design/uid-011/g2-review/README.md
  - docs/design/uid-011/g3-review/README.md
  - docs/design/uid-011/g4-review/README.md
  - docs/design/uid-011/g4-review/interaction-spec.md
  acceptance_criteria:
  - Show how admins add, preview, edit, order, show, hide, and remove clips at both sizes.
  - Show how saving, discarding, and failed saves affect the homepage clip list.
  - Cover zero, one, and multiple clips, retry for temporary player load failures, hidden confirmed unplayable clips, a hidden section with no displayable clips, and invalid or duplicate links.
  - Specify keyboard ordering and a non-drag ordering method on mobile.
  - Close the entire agreed scope in one G4 review package.
  - Show regular saving for six enabled clips and a confirmation with a return-to-edit option for seven or more.
  - Show a hidden clip when its TikTok cover cannot load. Show property search by name or DV code, optional single-property selection, the direct detail link, and the clip without its property button when the linked detail page cannot be viewed.
  - Show the default TikTok title, its editable website display title, and the source credit or TikTok link when credit is unavailable.
  - Show manual re-enabling after cover recovery and admin-bell notifications for both confirmed triggers with direct navigation to the affected clip.
  - Specify the single clip manager permission set and the actions it grants.
  open_g0_questions: []
  evidence_required:
  - design_artifact_links
  - desktop_mobile_review
  - accessibility_review
  - human_approval
